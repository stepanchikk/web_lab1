        <main>
            <h1>SVG: Векторна графіка та анімація</h1>
            <p>На цій сторінці продемонстровано можливості SVG згідно з лабораторною роботою №6.</p>

            <section>
                <h2>Анімоване SVG зображення (Варіант №11)</h2>

                <svg width="100%" height="450" viewBox="0 0 500 450" class="svg-canvas">
                    <desc>Анімована фігура, що точно відповідає схемі варіанту.</desc>

                    <!-- Текст по кривій -->
                    <defs>
                        <path id="text-path" d="M 50 60 Q 250 10 450 60" fill="none" />
                    </defs>
                    <text font-size="24" font-family="Arial, sans-serif" fill="#2c3e50" font-weight="bold">
                        <textPath href="#text-path">
                            AlcoFresh - Смак, що дарує настрій!
                        </textPath>
                    </text>

                    <!-- Група для фігури -->
                    <g id="figure" transform="translate(0, 30)">

                        <!-- Тіло (3.4. Зміна розміру) -->
                        <ellipse cx="250" cy="270" rx="130" ry="80" fill="#3498db">
                            <animateTransform attributeName="transform" type="scale" begin="0s" dur="2s"
                                values="1; 1.05; 1" repeatCount="indefinite" additive="sum" />
                        </ellipse>

                        <!-- Ноги (3.5. Перекручування) -->
                        <rect x="210" y="320" width="80" height="50" fill="#2980b9">
                            <animateTransform attributeName="transform" type="skewY" begin="0s" dur="3s"
                                values="0; 10; -10; 0" repeatCount="indefinite" additive="sum" />
                        </rect>

                        <!-- Руки (3.3. Обертання) -->
                        <rect x="375" y="240" width="60" height="60" fill="#2c3e50">
                            <animateTransform attributeName="transform" type="rotate" begin="0s" dur="4s"
                                from="0 405 270" to="360 405 270" repeatCount="indefinite" />
                        </rect>
                        <rect x="65" y="240" width="60" height="60" fill="#2c3e50">
                            <animateTransform attributeName="transform" type="rotate" begin="0s" dur="4s"
                                from="360 95 270" to="0 95 270" repeatCount="indefinite" />
                        </rect>

                        <!-- Група голови -->
                        <g id="head-group">
                            <!--
                                Статичні квадрати навколо голови, розміщені точно як на схемі.
                            -->
                            <rect x="100" y="130" width="50" height="50" fill="#007bff" /> <!-- Лівий боковий -->
                            <rect x="350" y="130" width="50" height="50" fill="#007bff" /> <!-- Правий боковий -->
                            <rect x="150" y="80" width="50" height="50" fill="#007bff" /> <!-- Лівий верхній -->
                            <rect x="300" y="80" width="50" height="50" fill="#007bff" /> <!-- Правий верхній -->

                            <!-- Голова (3.1. Зміна кольору) -->
                            <circle cx="200" cy="180" r="50" fill="#007bff">
                                <animate attributeName="fill" values="#007bff;gold;#007bff" dur="5s"
                                    repeatCount="indefinite" />
                            </circle>
                            <circle cx="300" cy="180" r="50" fill="#007bff">
                                <animate attributeName="fill" values="#007bff;gold;#007bff" dur="5s"
                                    repeatCount="indefinite" />
                            </circle>
                        </g>
                    </g>
                </svg>
            </section>
